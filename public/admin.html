<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>crave.sayz · Admin</title><meta name="robots" content="noindex">
<style>
:root{--bg:#eaf5ff;--card:#fff;--tx:#0d3b66;--mu:#52759c;--bd:#cfe3f7;--ac:#2e6fe0}
@media(prefers-color-scheme:dark){:root{--bg:#0a1c3d;--card:#102f5e;--tx:#eaf4ff;--mu:#a9c9ee;--bd:#24477d;--ac:#6aa8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
.w{max-width:820px;margin:0 auto;padding:24px 16px 60px}h1{margin:0 0 4px}h2{margin:0 0 10px;font-size:1.1rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:200px}button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:8px}
button.g{background:none;color:var(--tx);border:1px solid var(--bd)}.x{background:#d33;padding:4px 10px;margin:0}
.it{border-top:1px solid var(--bd);padding:10px 0;display:flex;justify-content:space-between;gap:10px}.it:first-child{border:0}
.it div{min-width:0;overflow-wrap:anywhere}small{color:var(--mu)}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{flex:1;min-width:120px;text-align:center}.stats b{font-size:1.8rem;display:block}
#msg{color:var(--mu);min-height:1.4em}.hide{display:none}
</style></head><body><div class="w">
<h1>☁️ crave.sayz admin</h1><p id="msg"></p>
<div id="login" class="c"><h2>Login</h2><input id="pw" type="password" placeholder="Admin password"><button id="go">Enter</button></div>
<div id="app" class="hide">
 <div class="c stats"><div><b id="sv">0</b>visitors</div><div><b id="sl">0</b>likes</div><div><b id="sm">0</b>messages</div><div><b id="ss">0</b>subscribers</div></div>
 <div class="c"><h2>Quotes <small>(one per line)</small></h2><textarea id="qs"></textarea><button id="saveQ">Save quotes</button></div>
 <div class="c"><h2>Messages</h2><div id="ms"></div></div>
 <div class="c"><h2>Subscribers</h2><div id="sb"></div><button class="g" id="csv">Download CSV</button></div>
 <button class="g" id="out">Log out</button>
</div></div>
<script>
const $=s=>document.querySelector(s);let pw=sessionStorage.getItem('pw')||'',subs=[];
const say=t=>$('#msg').textContent=t||'';
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json','x-admin-password':pw},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function row(host,main,sub,onDel){const r=document.createElement('div');r.className='it';const d=document.createElement('div');const a=document.createElement('div');a.textContent=main;const s=document.createElement('small');s.textContent=sub;d.append(a,s);const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=onDel;r.append(d,x);host.appendChild(r)}
async function load(){try{const d=await api('admin/data');$('#login').classList.add('hide');$('#app').classList.remove('hide');say('');
$('#sv').textContent=d.stats.visits;$('#sl').textContent=d.stats.likes;$('#sm').textContent=d.messages.length;$('#ss').textContent=d.subscribers.length;
$('#qs').value=d.quotes.join('\n');subs=d.subscribers;
const ms=$('#ms');ms.innerHTML=d.messages.length?'':'<small>No messages yet.</small>';
d.messages.forEach(m=>row(ms,m.message,m.name+' · '+m.email+' · '+new Date(m.at).toLocaleString(),async()=>{await api('admin/messages/'+encodeURIComponent(m.id),'DELETE');load()}));
const sb=$('#sb');sb.innerHTML=subs.length?'':'<small>No subscribers yet.</small>';
subs.forEach(s=>row(sb,s.email,new Date(s.at).toLocaleString(),async()=>{await api('admin/subscribers/'+encodeURIComponent(s.email),'DELETE');load()}));
}catch(e){sessionStorage.removeItem('pw');pw='';$('#app').classList.add('hide');$('#login').classList.remove('hide');say(e.message)}}
$('#go').onclick=()=>{pw=$('#pw').value;sessionStorage.setItem('pw',pw);load()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#saveQ').onclick=async()=>{try{const r=await api('admin/quotes','PUT',{quotes:$('#qs').value.split('\n')});say('Saved '+r.count+' quotes ✓')}catch(e){say(e.message)}};
$('#csv').onclick=()=>{const b=new Blob(['email,date\n'+subs.map(s=>s.email+','+s.at).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='subscribers.csv';a.click()};
$('#out').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
if(pw)load();
</script></body></html>
